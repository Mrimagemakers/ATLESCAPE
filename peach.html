<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peach City Quest | ATL Hustle</title><link rel="stylesheet" href="peach.css?v=landmark-lighting"><link rel="stylesheet" href="atl-radio.css"><link rel="stylesheet" href="atl-art.css"><style>

.rail-pin:hover,.rail-pin[aria-pressed="true"]{background:#ffe38b;color:#0c1523;transform:translate(-50%,-50%)}
.rail-stop-list{display:flex;flex-wrap:wrap;gap:.4rem}
.rail-stop-list button[aria-pressed="true"]{outline:2px solid #85dfff}
.rail-stops [hidden]{display:none}

<body><main>
<header class="quest-topbar"><a href="./">← ATL Hustle</a><button type="button" data-open-radio>Turn Up Radio</button><a href="https://pengamepublishing.com" target="_blank" rel="noopener noreferrer">PenGame Publishing ↗</a></header><div class="quest-hero peach-command mosaic-banner">
  <button type="button" class="banner-art" aria-label="Start your Peach City Quest adventure" data-open-tab="map"></button>
  <div class="peach-hero-content">
  <div class="peach-command-copy"><h1>Peach City <span>Quest</span></h1><p id="progress"></p>
  <div class="peach-hero-actions"><button type="button" data-open-tab="map" data-peach-icon="map">Explore Atlanta</button><button type="button" data-open-tab="challenges" data-peach-icon="challenges">Earn bonus XP</button></div></div>
  <canvas id="peachHeroArt" aria-hidden="true"></canvas></div>
</div>
<nav aria-label="Quest activities" id="tabs"><button data-tab="map">3D Atlas</button><button data-tab="markets">AR Market Map</button><button data-tab="challenges">Bonus Challenges</button><button data-tab="trivia">Atlanta Trivia</button><button data-tab="hunt">Atlanta Heritage Hunt</button><button data-tab="city">Things to Do</button><button data-tab="tours">Virtual Tours</button><button data-tab="videos">Videos</button><button data-tab="vault">Golden Peach Vault</button><button data-tab="arcade">Arcade</button><button data-tab="coach">Quest Coach</button><button data-tab="quests">Quest Journal</button><button data-tab="profile">Profile</button></nav>

  <button id="quest-room-create" type="button">Create room</button>

  <button id="quest-room-join" type="button">Join room</button>
  <button id="quest-room-leave" type="button" hidden>Leave room</button>
  <p id="quest-room-status" role="status">Explore solo or invite up to three teammates.</p>

<div id="xr-tools" hidden><canvas id="xr"></canvas><button id="exit-xr">End XR</button></div>
